project_id = "autocrm"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
minimum_password_length = 10
site_url = "http://localhost:3000"
enable_signup = true

[db.seed]
enabled = false

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 8
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no AutoCRM"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupere sua senha do AutoCRM"
content_path = "./supabase/templates/recovery.html"

# Disposable local Mailpit stack exercises three signups plus recovery.
[auth.rate_limit]
email_sent = 30
